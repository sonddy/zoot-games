<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zoot Games</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0f1c; color: #e6e9f2; font-family: -apple-system, system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1.2rem; padding: 2rem; text-align: center; }
    .spinner { width: 48px; height: 48px; border: 4px solid #1f2742; border-top-color: #ffc107; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; margin: 0; color: #ffc107; letter-spacing: 0.04em; }
    p { font-size: 0.9rem; margin: 0; color: #99a0b3; max-width: 320px; line-height: 1.5; }
    button { margin-top: 1rem; padding: 0.7rem 1.3rem; background: #ffc107; color: #0b0f1c; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Zoot Games</h1>
    <p>Connecting to the live server...</p>
    <p id="err" style="display:none;color:#ff6b6b;">Couldn't reach the server. Check your connection and tap retry.</p>
    <button id="retry" style="display:none;" onclick="location.reload()">Retry</button>
  </div>
  <script>
    setTimeout(function() {
      document.getElementById('err').style.display = 'block';
      document.getElementById('retry').style.display = 'inline-block';
    }, 10000);
  </script>
</body>
</html>
